<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
</div>

<section id="welcome" class="welcome">
  <div class="checks" aria-hidden="true"><i>✓</i><i>✓</i><i>✓</i></div>
  <h1>Welcome to <span>My To-Do List</span></h1>
  <p>Plan your day, tick things off and watch your progress grow.</p>
  <button id="startBtn" class="cta" type="button">Get Started</button>
  <small>Made by Sangeeta Shetty</small>
</section>

<main id="app" class="app hidden">
  <header class="head">
    <div class="title-row">
      <button id="homeBtn" class="home" type="button" aria-label="Back to welcome screen">←</button>
      <div>
        <h1>My Tasks</h1>
        <p id="today" class="today"></p>
      </div>
    </div>
    <div class="progress-box">
      <span id="progressText">0% done</span>
      <div class="bar"><div id="bar" class="fill"></div></div>
    </div>
  </header>

  <form id="addForm" class="add">
    <input id="taskInput" type="text" placeholder="What needs doing today?" maxlength="120" aria-label="New task" autocomplete="off" required>
    <button type="submit" class="primary">Add Task</button>
  </form>

  <section>
    <h2>Pending Tasks <span id="pendingCount" class="count pending">0 pending</span></h2>
    <ul id="pendingList" class="list"></ul>
  </section>

  <section>
    <h2>Completed Tasks <span id="doneCount" class="count done">0 completed</span></h2>
    <ul id="doneList" class="list"></ul>
    <button id="clearDone" type="button" class="link">Clear completed</button>
  </section>

  <footer>Made by <strong>Sangeeta Shetty</strong> · Oasis Infobyte Internship</footer>
</main>
<script src="script.js"></script>
</body>
</html>
