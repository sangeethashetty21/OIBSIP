<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<section id="welcome" class="welcome">
  <div class="logo" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i>
  </div>
  <h1>Welcome to <span>Mini Calculator</span></h1>
  <p>Quick, clean and keyboard friendly. Do your math without the clutter.</p>
  <button id="openBtn" class="cta" type="button">Open Calculator</button>
  <small>Built with HTML, CSS &amp; JavaScript</small>
</section>

<div id="calcWrap" class="calc-wrap hidden">
  <main class="calc" aria-label="Calculator">
    <header class="calc-top">
      <button id="homeBtn" class="home" type="button" aria-label="Back to welcome screen">←</button>
      <span>Mini Calculator</span>
    </header>
    <div class="display" aria-live="polite">
      <div id="expr" class="expr"></div>
      <div id="out" class="out">0</div>
    </div>
    <div class="keys">
      <button class="fn" data-key="C">C</button>
      <button class="fn" data-key="back" aria-label="Backspace">⌫</button>
      <button class="op" data-key="÷">÷</button>
      <button class="op" data-key="×">×</button>
      <button class="num" data-key="7">7</button>
      <button class="num" data-key="8">8</button>
      <button class="num" data-key="9">9</button>
      <button class="op" data-key="−">−</button>
      <button class="num" data-key="4">4</button>
      <button class="num" data-key="5">5</button>
      <button class="num" data-key="6">6</button>
      <button class="op" data-key="+">+</button>
      <button class="num" data-key="1">1</button>
      <button class="num" data-key="2">2</button>
      <button class="num" data-key="3">3</button>
      <button class="eq" data-key="=">=</button>
      <button class="num zero" data-key="0">0</button>
      <button class="num" data-key=".">.</button>
    </div>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
